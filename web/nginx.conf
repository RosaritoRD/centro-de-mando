# tu empresa — APM · nginx del front.
#
# Sirve los estáticos que produjo Vite y reenvía /api/ al contenedor apm-api.
# El TLS lo termina Nginx Proxy Manager por delante; aquí todo es HTTP plano
# dentro de la red de Docker.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El TLS lo termina NPM: un Location absoluto aquí saldría con http://
    # y sería un downgrade de protocolo.
    absolute_redirect off;

    # ── Cabeceras de seguridad ──────────────────────────────────
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # CSP: sin CDN y sin Google Fonts. 'unsafe-inline' en script-src solo por
    # el snippet del tema, que va inline a propósito para no provocar un
    # fogonazo antes del primer pintado. Cuando el snippet se estabilice, se
    # cambia por su hash — igual que en tu web principal.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── API ─────────────────────────────────────────────────────
    # resolver de Docker + variable: si apm-api está caída, el front sigue
    # sirviéndose y enseña "degradado" en vez de dar un 502 en toda la página.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $apm_upstream http://apm-api:3000;
        proxy_pass $apm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Streaming del chat (Fase 2) ─────────────────────────────
    # Va aparte y ANTES en especificidad porque el SSE necesita lo contrario
    # que el resto: nada de buffering y un timeout largo. Con el buffering
    # puesto, la respuesta del agente llega de golpe al final y parece que el
    # chat está colgado (docs/research/F-n8n-automatizaciones.md §6).
    #
    # ⚠️ Esto NO basta por sí solo: Nginx Proxy Manager tiene su propio
    # buffering por delante y hay que desactivarlo también en su Proxy Host.
    location = /api/chat {
        resolver 127.0.0.11 valid=30s;
        set $apm_chat http://apm-api:3000;
        proxy_pass $apm_chat;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Connection      '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # ── Estáticos ───────────────────────────────────────────────
    # Vite pone un hash en el nombre de cada archivo, así que se pueden cachear
    # para siempre: si el contenido cambia, cambia el nombre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html para que el router
    # del cliente decida. index.html NO se cachea, o el navegador seguiría
    # pidiendo los assets viejos después de un despliegue.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
