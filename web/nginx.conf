# Acme — APM · front-end nginx.
#
# Serves the static files Vite produced and proxies /api/ to the apm-api
# container. Nginx Proxy Manager terminates TLS in front; in here everything is
# plain HTTP inside the Docker network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NPM terminates TLS: an absolute Location here would go out as http://
    # and be a protocol downgrade.
    absolute_redirect off;

    # ── Security headers ────────────────────────────────────────
    include /etc/nginx/snippets/security-headers.conf;

    # ── API ─────────────────────────────────────────────────────
    # Docker resolver + variable: if apm-api is down, the front end keeps being
    # served and shows "degraded" instead of a full-page 502.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $apm_upstream http://apm-api:3000;
        proxy_pass $apm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── Chat streaming (Phase 2) ────────────────────────────────
    # Separate and MORE specific because SSE needs the opposite of everything
    # else: no buffering and a long timeout. With buffering on, the agent's
    # reply arrives all at once at the end and the chat looks frozen
    # (docs/research/F-n8n-automatizaciones.md §6).
    #
    # ⚠️ This is NOT enough on its own: Nginx Proxy Manager has its own
    # buffering in front, and it must be turned off in its Proxy Host too.
    location = /api/chat {
        resolver 127.0.0.11 valid=30s;
        set $apm_chat http://apm-api:3000;
        proxy_pass $apm_chat;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header Connection      '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    # ── Static files ────────────────────────────────────────────
    # Vite puts a hash in every file name, so they can be cached forever: if
    # the content changes, the name changes.
    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: any unknown route returns index.html so the client router decides.
    # index.html is NOT cached, or the browser would keep requesting the old
    # assets after a deploy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
