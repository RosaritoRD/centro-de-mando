<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>APM — Acme</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#F6F8FC" />
<!--
  Theme before the first paint. Inline and not in a module because a module
  arrives after the browser has already painted: you'd see a white flash when
  opening in dark mode, or the other way round. Same pattern as your main website.

  Light is the default (docs/research/H-spectra-tokens.md §H.2): it is in
  your main website, and two products from the same house can't open on different
  backgrounds.
-->
<script>
  (function () {
    try {
      var t = localStorage.getItem('apm-theme');
      document.body && (document.body.dataset.theme = t === 'dark' ? 'dark' : 'light');
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    } catch (e) { /* no storage: stays light */ }
  })();
</script>
</head>
<body data-theme="light">
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
