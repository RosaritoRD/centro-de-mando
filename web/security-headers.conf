# Acme — APM · security headers.
#
# In its own file because nginx DROPS every inherited add_header in a location
# that declares one of its own: `location /` adds Cache-Control, so until
# 16/10/2026 index.html went out with NONE of these. Include it in every
# location that has an add_header.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
# CSP: no CDN and no Google Fonts. 'unsafe-inline' in script-src only for
# the theme snippet, which is inline on purpose to avoid a flash before the
# first paint. Once the snippet settles, it gets replaced by its hash —
# same as your main website.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
