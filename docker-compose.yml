# tu empresa — APM
#
# Dos contenedores nuevos y nada más: ni Postgres, ni Redis, ni proxy. La BD
# `apm` vive en el n8n_postgres que ya existe y el TLS lo termina el Nginx
# Proxy Manager que ya está montado (docs/ARCHITECTURE.md §1).

services:
  # nginx con los estáticos que compiló Vite. En producción no corre Node.
  web:
    build: ./web
    container_name: apm-web
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - api

  api:
    build: ./api
    container_name: apm-api
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      # Para que apm-web (y NPM, si algún día hace falta) lo alcance.
      - proxy
      # Para hablar con la BD apm dentro de n8n_postgres, y con n8n, sin
      # publicar un solo puerto al host.
      - n8n_internal
      # Para llamar al scraper (http://gmaps-scraper:8080).
      - scraper

  # Scraper de Google Maps (gosom/google-maps-scraper) en modo web/REST.
  # ⚠ Decisión de el dueño 24/09/2026: uso INTERNO asumiendo los ToS de Google.
  # Sin puertos publicados: solo lo alcanza apm-api por la red `scraper`.
  # -c 1 = una sola búsqueda a la vez (búsqueda "suave"); los topes diarios
  # los aplica la API (api/sources/google-maps.js). En reposo usa ~50 MB.
  gmaps-scraper:
    image: gosom/google-maps-scraper@sha256:e205c02913c5a69c16fc2094b8e5b194a2f655166d2c1126d50548d216e6b1b2  # fijada el 24/09/2026
    container_name: apm-gmaps-scraper
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata", "-c", "1"]
    volumes:
      - gmaps_data:/gmapsdata
    mem_limit: 1g
    cpus: 0.75
    networks:
      - scraper

networks:
  # Red propia del scraper: necesita salida a internet (Google), pero no ver
  # la BD ni el proxy.
  scraper:
    name: apm_scraper
  n8n_internal:
    external: true
    name: n8n_n8n_internal
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}

volumes:
  gmaps_data:
