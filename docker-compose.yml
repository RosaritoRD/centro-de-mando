# Acme — APM
#
# Two new containers and nothing else: no Postgres, no Redis, no proxy. The
# `apm` DB lives in the existing n8n_postgres, and TLS is terminated by the
# Nginx Proxy Manager that's already set up (docs/ARCHITECTURE.md §1).

services:
  # nginx with the static files Vite built. Node does not run in production.
  web:
    build: ./web
    container_name: apm-web
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - api

  api:
    build: ./api
    container_name: apm-api
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      # So apm-web (and NPM, if ever needed) can reach it.
      - proxy
      # To talk to the apm DB inside n8n_postgres, and to n8n, without
      # publishing a single port on the host.
      - n8n_internal
      # To call the scraper (http://gmaps-scraper:8080).
      - scraper

  # Google Maps scraper (gosom/google-maps-scraper) in web/REST mode.
  # ⚠ the owner's decision 24/09/2026: INTERNAL use, accepting Google's ToS risk.
  # No published ports: only apm-api reaches it, over the `scraper` network.
  # -c 1 = a single search at a time ("gentle" searching); the daily caps are
  # enforced by the API (api/sources/google-maps.js). Uses ~50 MB at rest.
  gmaps-scraper:
    image: gosom/google-maps-scraper@sha256:e205c02913c5a69c16fc2094b8e5b194a2f655166d2c1126d50548d216e6b1b2  # pinned on 24/09/2026
    container_name: apm-gmaps-scraper
    restart: unless-stopped
    command: ["-data-folder", "/gmapsdata", "-c", "1"]
    volumes:
      - gmaps_data:/gmapsdata
    mem_limit: 1g
    cpus: 0.75
    networks:
      - scraper

networks:
  # The scraper's own network: it needs internet access (Google), but must not
  # see the DB or the proxy.
  scraper:
    name: apm_scraper
  n8n_internal:
    external: true
    name: n8n_n8n_internal
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy-manager_default}

volumes:
  gmaps_data:
